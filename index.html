<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말씀 암송장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a two-column study desk — verse index on the left, recitation sheet on the right; stacks on phones. */
:root {
  --bg: #eef0f4;
  --paper: #fbfbfd;
  --ink: #1b2236;
  --muted: #5e6680;
  --line: #d7dbe5;
  --accent: #2c4f86;
  --accent-soft: #dfe7f4;
  --ok: #1f7a4d;
  --ok-soft: #dcf0e5;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --miss: #9a6200;
  --miss-soft: #f6ead0;
  --f-verse: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151f; --paper: #1a1f2d; --ink: #e6e9f2; --muted: #9aa2ba; --line: #2d3446;
  --accent: #8fb0e6; --accent-soft: #233251; --ok: #6fd3a0; --ok-soft: #173a2a;
  --bad: #ff8a80; --bad-soft: #3d1d1b; --miss: #f0c060; --miss-soft: #3a2e14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151f; --paper: #1a1f2d; --ink: #e6e9f2; --muted: #9aa2ba; --line: #2d3446;
  --accent: #8fb0e6; --accent-soft: #233251; --ok: #6fd3a0; --ok-soft: #173a2a;
  --bad: #ff8a80; --bad-soft: #3d1d1b; --miss: #f0c060; --miss-soft: #3a2e14; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55 }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px }
h1 { font-family: var(--f-verse); font-weight: 700; font-size: 30px; margin: 0; letter-spacing: -0.01em; text-wrap: balance }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted) }
.who input { width: 120px }
.mode { font-size: 12px; color: var(--muted) }

.grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr) } }

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.panel-h h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted) }

.list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 62vh; overflow-y: auto }
.item { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; text-align: left; background: none; color: inherit; font: inherit; width: 100% }
.item:hover { background: var(--accent-soft) }
.item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent) }
.item .ref { font-weight: 600 }
.item .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.item .peek { color: var(--muted); font-family: var(--f-verse); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap }
.chip.ok { background: var(--ok-soft); color: var(--ok) }
.chip.near { background: var(--miss-soft); color: var(--miss) }
.chip.new { background: var(--bg); color: var(--muted); border: 1px solid var(--line) }

.empty { padding: 22px 18px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; font-size: 14px }

button, .btn { font: inherit; font-size: 14px; border-radius: 7px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink) }
button:hover { border-color: var(--accent) }
button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 600 }
button.ghost { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px }
button.ghost:hover { color: var(--ink) }
button.danger { color: var(--bad) }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button:disabled { opacity: .5; cursor: default }

input, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100% }
textarea { resize: vertical; min-height: 120px; font-family: var(--f-verse); font-size: 17px; line-height: 1.8 }
label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px }

.form { padding: 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line) }
.form .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }

.sheet { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 18px }
.sheet .reftitle { font-family: var(--f-verse); font-size: 24px; font-weight: 700; margin: 0 }
.meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.toolbar .spacer { flex: 1 }
.hint { font-family: var(--f-verse); font-size: 16px; color: var(--muted); background: var(--bg); border-radius: 7px; padding: 10px 14px; letter-spacing: 0.04em }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-direction: row }
.check input { width: auto }

.result { border-top: 1px dashed var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 14px }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }
.score .big { font-family: var(--f-num); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums }
.score .big.ok { color: var(--ok) } .score .big.bad { color: var(--bad) }
.score .verdict { font-weight: 600; font-size: 17px }
.score .detail { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.diff { font-family: var(--f-verse); font-size: 18px; line-height: 2.1; word-break: keep-all; overflow-wrap: anywhere }
.diff .sub { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 1px; margin: 0; font-size: inherit; position: relative }
.diff .sub small { font-size: 11px; position: absolute; left: 50%; top: -1.2em; transform: translateX(-50%); color: var(--bad); font-family: var(--f-ui); white-space: nowrap }
.diff .del { color: var(--miss); background: var(--miss-soft); border-bottom: 2px dashed var(--miss); border-radius: 3px }
.diff .ins { color: var(--bad); text-decoration: line-through; opacity: .8; font-size: .85em }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend span b { font-weight: 500; padding: 0 4px; border-radius: 3px }
.legend .l-sub { background: var(--bad-soft); color: var(--bad) }
.legend .l-del { background: var(--miss-soft); color: var(--miss); border-bottom: 2px dashed var(--miss) }
.legend .l-ins { color: var(--bad); text-decoration: line-through }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.log li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 14px; align-items: center }
.log li:first-child { border-top: 0 }
.log .n { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.log .e { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 13px }
.log .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums }
.people { display: flex; gap: 6px; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .result { animation: rise .25s ease-out } @keyframes rise { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>말씀 암송장</h1>
      <p class="sub">구절을 넣고, 외워서 써 보고, 몇 글자 틀렸는지 확인하세요.</p>
    </div>
    <div class="who" style="flex-wrap:wrap">
      <span id="my-count" class="chip ok" hidden></span>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="구절 목록">
      <div class="panel-h"><h2>암송 구절 <span id="verse-count" style="color:var(--accent)"></span></h2><button id="btn-new" class="ghost">+ 구절 추가</button></div>
      <ul class="list" id="verse-list"></ul>
      <div class="empty" id="verse-empty" hidden>
        <div>아직 구절이 없어요. 외울 구절의 장절과 본문을 넣어 주세요.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="btn-new2" class="primary">구절 추가</button><button id="btn-sample">예시 구절 3개 넣기</button></div>
      </div>
      <form class="form" id="verse-form" hidden>
        <label for="f-ref">장절<input id="f-ref" placeholder="예: 요한복음 3:16" required maxlength="60"></label>
        <label for="f-text">본문<textarea id="f-text" placeholder="외울 말씀을 붙여 넣으세요" required></textarea></label>
        <div class="actions">
          <button type="button" id="f-del" class="danger" hidden>삭제</button>
          <span style="flex:1"></span>
          <button type="button" id="f-cancel">취소</button>
          <button type="submit" class="primary" id="f-save">저장</button>
        </div>
      </form>
      <div class="panel-h" style="border-top:1px solid var(--line);border-bottom:0"><span class="mode" id="mode"></span></div>
    </section>

    <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <section class="panel" id="practice" aria-label="암송하기"></section>
      <section class="panel" aria-label="암송 기록">
        <div class="panel-h"><h2 id="log-title">암송 기록</h2><button id="log-clear" class="ghost danger" hidden>기록 모두 지우기</button></div>
        <ul class="log" id="log"></ul>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch { return d } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
  };
  const SAMPLES = [
    { ref: "요한복음 3:16", text: "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라" },
    { ref: "시편 23:1", text: "여호와는 나의 목자시니 내가 부족함이 없으리로다" },
    { ref: "빌립보서 4:13", text: "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라" }
  ];

  /* ===== 기본 구절 =====
     링크를 연 모든 사람에게 보이는 구절이에요.
     구절을 추가하려면 아래 형식으로 한 줄을 더 넣으세요 (id는 겹치지 않는 아무 영문/숫자).
     { id: "my1", ref: "장절", text: "본문" },
  */
  const BUILTIN = [
    { id: "05rcjp9jdrvm2smeg32h", ref: "요한복음 1:1,14", text: "태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라" },
    { id: "4h3ca90e9qfqdd6722xf", ref: "히브리서 1:8", text: "아들에 관하여는 하나님이여 주의 보좌는 영영하며 주의 나라의 규는 공평한 규이니이다" },
    { id: "hjl3xt2iwn15sgqbsrim", ref: "히브리서 4:15", text: "우리에게 있는 대제사장은 우리의 연약함을 동정하지 못하실 이가 아니요 모든 일에 우리와 똑같이 시험을 받으신 이로되 죄는 없으시니라" },
    { id: "udu2dd78fvv10yk71srb", ref: "누가복음 2:52", text: "예수는 지혜와 키가 자라가며 하나님과 사람에게 더욱 사랑스러워 가시더라" },
    { id: "bzq7t57h4xs8wphtvjw2", ref: "고린도전서 15:3,4", text: "내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고 장사 지낸 바 되셨다가 성경대로 사흘 만에 다시 살아나사" },
    { id: "e79j872iyovemb2ubzt9", ref: "고린도전서 15:20", text: "그러나 이제 그리스도께서 죽은 자 가운데서 다시 살아나사 잠자는 자들의 첫 열매가 되셨도다" },
    { id: "lwllbp25gv40gg8whtve", ref: "요한복음 1:18", text: "본래 하나님을 본 사람이 없으되 아버지 품 속에 있는 독생하신 하나님이 나타내셨느니라" },
    { id: "4n86dom0qs7e2f1l9mtf", ref: "히브리서 1:3", text: "이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결하게 하는 일을 하시고 높은 곳에 계신 지극히 크신 이의 우편에 앉으셨느니라" },
    { id: "u2op64jr6n430nmb44cx", ref: "누가복음 19:10", text: "인자가 온 것은 잃어버린 자를 찾아 구원하려 함이니라" },
    { id: "gbjcrhs7nm6o2kzbit8m", ref: "베드로전서 1:18,19", text: "너희가 알거니와 너희 조상이 물려 준 헛된 행실에서 대속함을 받은 것은 은이나 금 같이 없어질 것으로 된 것이 아니요 오직 흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피로 된 것이니라" },
    { id: "86yvd2uwyuw5mhcbsm25", ref: "데살로니가전서 4:16,17", text: "주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고 그 후에 우리 살아 남은 자들도 그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라" },
    { id: "nxooli1c0fnp71bba4ry", ref: "요한일서 3:2,3", text: "사랑하는 자들아 우리가 지금은 하나님의 자녀라 장래에 어떻게 될지는 아직 나타나지 아니하였으나 그가 나타나시면 우리가 그와 같을 줄을 아는 것은 그의 참모습 그대로 볼 것이기 때문이니 주를 향하여 이 소망을 가진 자마다 그의 깨끗하심과 같이 자기를 깨끗하게 하느니라" },
    { id: "muyys43tuk5z3hubn6bg", ref: "요한복음 16:13,14", text: "그러나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 스스로 말하지 않고 오직 들은 것을 말하며 장래 일을 너희에게 알리시리라 그가 내 영광을 나타내리니 내 것을 가지고 너희에게 알리시겠음이라" },
    { id: "25hckcx1xnhzx60hevo8", ref: "고린도전서 12:3", text: "그러므로 내가 너희에게 알리노니 하나님의 영으로 말하는 자는 누구든지 예수를 저주할 자라 하지 아니하고 또 성령으로 아니하고는 누구든지 예수를 주시라 할 수 없느니라" },
    { id: "juuqp67fri51hlwmk18c", ref: "로마서 8:9", text: "만일 너희 속에 하나님의 영이 거하시면 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라" },
    { id: "4b1nx7nec7q2phuzxa7u", ref: "갈라디아서 4:6", text: "너희가 아들이므로 하나님이 그 아들의 영을 우리 마음 가운데 보내사 아빠 아버지라 부르게 하셨느니라" },
    { id: "6c0qvs05i5qdxwujj066", ref: "에베소서 5:18", text: "술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라" },
    { id: "ja9h1d0k1yxmxsi0qkm6", ref: "갈라디아서 5:16", text: "내가 이르노니 너희는 성령을 따라 행하라 그리하면 육체의 욕심을 이루지 아니하리라" },
    { id: "16j0hen23hsxpzy65iep", ref: "고린도전서 2:9,10", text: "기록된 바 하나님이 자기를 사랑하는 자들을 위하여 예비하신 모든 것은 눈으로 보지 못하고 귀로 듣지 못하고 사람의 마음으로 생각하지도 못하였다 함과 같으니라 오직 하나님이 성령으로 이것을 우리에게 보이셨으니 성령은 모든 것 곧 하나님의 깊은 것까지도 통달하시느니라" },
    { id: "w1ck9s14vnknlfzhgtem", ref: "요한복음 14:26", text: "보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치고 내가 너희에게 말한 모든 것을 생각나게 하리라" },
    { id: "ak5vnyh55d9ii0k0ji1b", ref: "고린도전서 2:4,5", text: "내 말과 내 전도함이 설득력 있는 지혜의 말로 하지 아니하고 다만 성령의 나타나심과 능력으로 하여 너희 믿음이 사람의 지혜에 있지 아니하고 다만 하나님의 능력에 있게 하려 하였노라" },
    { id: "27hi3ku4uw0b7pk7f240", ref: "데살로니가전서 1:5", text: "이는 우리 복음이 너희에게 말로만 이른 것이 아니라 또한 능력과 성령과 큰 확신으로 된 것임이라 우리가 너희 가운데서 너희를 위하여 어떤 사람이 된 것은 너희가 아는 바와 같으니라" }
  ].map(v => ({ ...v, builtin: true }));

  const state = { verses: [], attempts: [], selected: ls.get("sel", null), editing: null, result: null, hint: false, show: false, ignorePunct: ls.get("ignorePunct", true), ready: false };
  let toastT, pDel = null, logDel = null, clearArmed = false;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200) }

  /* ---------- storage: shared db when available, this browser otherwise ---------- */
  const store = { mode: "loading" };
  function useLocal() {
    store.mode = "local";
    const load = () => { state.verses = [...BUILTIN, ...ls.get("verses", [])]; state.attempts = ls.get("attempts", []); state.ready = true; render() };
    const id = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    store.addVerse = async v => { const a = ls.get("verses", []); a.push({ id: id(), ...v }); ls.set("verses", a); load(); return a[a.length - 1].id };
    store.updateVerse = async (vid, v) => { ls.set("verses", ls.get("verses", []).map(x => x.id === vid ? { ...x, ...v } : x)); load() };
    store.deleteVerse = async vid => { ls.set("verses", ls.get("verses", []).filter(x => x.id !== vid)); ls.set("attempts", ls.get("attempts", []).filter(x => x.verseId !== vid)); load() };
    store.addAttempt = async a => { const arr = ls.get("attempts", []); arr.push({ id: id(), ...a }); ls.set("attempts", arr.slice(-500)); load() };
    store.deleteAttempt = async aid => { ls.set("attempts", ls.get("attempts", []).filter(x => x.id !== aid)); load() };
    store.deleteAttempts = async vid => { ls.set("attempts", ls.get("attempts", []).filter(x => x.verseId !== vid)); load() };
    load();
  }
  async function useDb(db) {
    store.mode = "shared";
    const snapList = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
    db.collection("verses").orderBy("createdAt", "asc").onSnapshot(s => { state.verses = snapList(s); state.ready = true; render() }, onErr);
    // 채점 기록은 각자 비공개 공간(data/users/<id>)에 저장 — 다른 사람(소유자 포함)은 못 봄
    let uid = null;
    try { const u = await window.claude.use("user"); uid = u ? await u.id() : null } catch {}
    const localId = () => "l" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    let remote = [];
    const merge = () => { state.attempts = [...remote, ...ls.get("attempts", [])]; render() };
    const addLocal = a => { const arr = ls.get("attempts", []); arr.push({ id: localId(), ...a }); ls.set("attempts", arr.slice(-500)); merge() };
    const col = uid ? db.doc("data/users/" + uid + "/profile").collection("attempts") : null;
    if (col) col.orderBy("at", "desc").limit(400).onSnapshot(s => { remote = snapList(s); merge() }, () => {});
    merge();
    store.addAttempt = async a => { if (!col) return addLocal(a); try { await col.add(a) } catch { addLocal(a) } };
    store.deleteAttempts = async vid => {
      ls.set("attempts", ls.get("attempts", []).filter(x => x.verseId !== vid));
      if (col) for (const a of remote.filter(x => x.verseId === vid)) { try { await col.doc(a.id).delete() } catch {} }
      merge();
    };
    store.deleteAttempt = async aid => {
      ls.set("attempts", ls.get("attempts", []).filter(x => x.id !== aid));
      if (col && remote.some(x => x.id === aid)) await col.doc(aid).delete();
      merge();
    };
    store.addVerse = async v => (await db.collection("verses").add({ ...v, createdAt: Date.now() })).id;
    store.updateVerse = (vid, v) => db.doc("verses/" + vid).update(v);
    store.deleteVerse = async vid => {
      await db.doc("verses/" + vid).delete();
      await store.deleteAttempts(vid);
    };
  }
  function onErr(e) { toast(e && e.code === "revoked" ? "저장소에 연결할 수 없어요" : "기록을 불러오지 못했어요. 새로고침해 주세요") }
  async function guarded(p, okMsg) {
    try { const r = await p; if (okMsg) toast(okMsg); return r }
    catch (e) {
      if (e && e.code === "invalid_argument") toast("이 페이지에 쓸 수 있는 권한이 없어요. 공유한 분께 편집 권한을 요청하세요");
      else if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 오래된 구절을 지워 주세요");
      else toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요");
    }
  }

  /* ---------- grading ---------- */
  const STRIP_ALL = /[\s\p{P}\p{S}]/u, STRIP_SPACE = /\s/u;
  function keep(ch) { return !(state.ignorePunct ? STRIP_ALL : STRIP_SPACE).test(ch) }
  function grade(target, typed) {
    const T = [], tIdx = [];
    [...target].forEach((ch, i) => { if (keep(ch)) { T.push(ch); tIdx.push(i) } });
    const U = [...typed].filter(keep);
    const n = T.length, m = U.length;
    const D = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = 0; i <= n; i++) D[i][0] = i;
    for (let j = 0; j <= m; j++) D[0][j] = j;
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
      D[i][j] = Math.min(D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + (T[i-1] === U[j-1] ? 0 : 1));
    // backtrace → per-target status and extra chars inserted before each target char
    const status = new Array(n).fill("ok"), typedAt = new Array(n).fill(""), insBefore = Array.from({ length: n + 1 }, () => "");
    let i = n, j = m, sub = 0, del = 0, ins = 0;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && D[i][j] === D[i-1][j-1] + (T[i-1] === U[j-1] ? 0 : 1)) {
        if (T[i-1] !== U[j-1]) { status[i-1] = "sub"; typedAt[i-1] = U[j-1]; sub++ }
        i--; j--;
      } else if (i > 0 && D[i][j] === D[i-1][j] + 1) { status[i-1] = "del"; del++; i-- }
      else { insBefore[i] = U[j-1] + insBefore[i]; ins++; j-- }
    }
    // render onto the original text so spacing and punctuation stay readable
    const chars = [...target]; let html = "", k = 0;
    chars.forEach((ch, pos) => {
      if (k < n && tIdx[k] === pos) {
        if (insBefore[k]) html += `<span class="ins">${esc(insBefore[k])}</span>`;
        const c = esc(ch);
        html += status[k] === "ok" ? c : status[k] === "sub" ? `<span class="sub">${c}<small>${esc(typedAt[k])}</small></span>` : `<span class="del">${c}</span>`;
        k++;
      } else html += esc(ch);
    });
    if (insBefore[n]) html += `<span class="ins">${esc(insBefore[n])}</span>`;
    return { errors: D[n][m], total: n, sub, del, ins, html };
  }

  /* ---------- helpers ---------- */
  function verseStatus(vid) {
    const mine = state.attempts.filter(a => a.verseId === vid);
    if (mine.some(a => a.errors === 0)) return { cls: "ok", label: "외움" };
    if (mine.length) return { cls: "near", label: `연습 중 · 최소 ${Math.min(...mine.map(a => a.errors))}자 틀림` };
    return { cls: "new", label: "아직 안 외움" };
  }
  const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` };
  const initials = text => text.split(/\s+/).filter(Boolean).map(w => w[0] + "○".repeat(Math.max(0, [...w].length - 1))).join(" ");

  /* ---------- render ---------- */
  function render() {
    $("verse-count").textContent = state.verses.length ? `${state.verses.length}개` : "";
    const mine = state.verses.filter(v => verseStatus(v.id).cls === "ok").length;
    $("my-count").hidden = !state.verses.length;
    $("my-count").textContent = `내가 외운 구절 ${mine} / ${state.verses.length}`;
    $("mode").textContent = store.mode === "shared" ? "구절은 공유돼요 · 채점 기록은 나만 봐요" : store.mode === "local" ? `기본 구절 ${BUILTIN.length}개 · 직접 추가한 구절과 채점 기록은 이 브라우저에만 저장돼요` : "불러오는 중…";
    if (state.selected && !state.verses.some(v => v.id === state.selected)) state.selected = null;
    if (!state.selected && state.verses.length) state.selected = state.verses[0].id;

    const list = $("verse-list");
    list.innerHTML = state.verses.map(v => {
      const st = verseStatus(v.id);
      return `<li><button class="item" data-id="${esc(v.id)}" aria-current="${v.id === state.selected}">
        <span class="row"><span class="ref">${esc(v.ref)}</span><span class="chip ${st.cls}">${esc(st.label)}</span></span>
        </button></li>`;
    }).join("");
    $("verse-empty").hidden = !state.ready || state.verses.length > 0 || state.editing !== null;
    list.hidden = state.verses.length === 0;

    renderPractice();
    renderLog();
  }

  function renderPractice() {
    const p = $("practice"), v = state.verses.find(x => x.id === state.selected);
    if (!v) {
      p.innerHTML = `<div class="empty">${state.ready ? "왼쪽에서 구절을 고르거나 새 구절을 추가하면 여기서 암송할 수 있어요." : "구절을 불러오는 중이에요…"}</div>`;
      return;
    }
    const prevVal = $("answer") ? $("answer").value : "";
    const sameVerse = p.dataset.vid === v.id;
    const st = verseStatus(v.id);
    const r = state.result;
    p.dataset.vid = v.id;
    p.innerHTML = `<div class="sheet">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap">
        <div><h3 class="reftitle">${esc(v.ref)}</h3>
        <div class="meta"><span class="chip ${st.cls}">${esc(st.label)}</span><span>${grade(v.text, "").total}자 (띄어쓰기${state.ignorePunct ? "·문장부호" : ""} 제외)</span></div></div>
        ${v.builtin ? `<span class="chip new">기본 구절</span>` : `<div style="display:flex;gap:4px;flex-wrap:wrap"><button class="ghost" id="btn-edit">구절 수정</button><button class="ghost danger" id="btn-del">${pDel === v.id ? "정말 삭제할까요? 한 번 더 누르세요" : "삭제"}</button></div>`}
      </div>
      ${state.show ? `<div class="hint" style="color:var(--ink);letter-spacing:0">${esc(v.text)}</div>` : state.hint ? `<div class="hint">${esc(initials(v.text))}</div>` : ""}
      <label for="answer">외운 말씀을 써 보세요
        <textarea id="answer" placeholder="본문을 보지 않고 입력하세요" autocomplete="off" spellcheck="false"></textarea></label>
      <div class="toolbar">
        <button class="primary" id="btn-grade">채점하기</button>
        <button id="btn-hint">${state.hint ? "힌트 숨기기" : "첫 글자 힌트"}</button>
        <button id="btn-show">${state.show ? "본문 숨기기" : "본문 보기"}</button>
        <span class="spacer"></span>
        <label class="check" for="opt-punct"><input type="checkbox" id="opt-punct" ${state.ignorePunct ? "checked" : ""}>문장부호 무시</label>
      </div>
      ${r && r.vid === v.id ? `<div class="result">
        <div class="score">
          <span class="big ${r.errors === 0 ? "ok" : "bad"}">${r.errors}<span style="font-size:18px">자</span></span>
          <div><div class="verdict">${r.errors === 0 ? "완벽하게 외웠어요" : r.errors <= 3 ? "거의 다 왔어요" : "조금 더 연습해요"}</div>
          <div class="detail">틀린 글자 ${r.sub} · 빠진 글자 ${r.del} · 더 쓴 글자 ${r.ins} · 정확도 ${r.total ? Math.max(0, Math.round((1 - r.errors / r.total) * 100)) : 0}%</div></div>
        </div>
        <div class="diff">${r.html}</div>
        <div class="legend"><span><b class="l-sub">틀림</b> 위 작은 글씨는 내가 쓴 글자</span><span><b class="l-del">빠짐</b></span><span><b class="l-ins">더 씀</b></span></div>
        <div class="toolbar"><span class="meta">내 기록에 저장했어요 (나만 볼 수 있어요)</span><span class="spacer"></span><button id="btn-retry">다시 하기</button></div>
      </div>` : ""}
    </div>`;
    if (sameVerse) $("answer").value = prevVal;

    $("btn-grade").onclick = async () => {
      const typed = $("answer").value;
      if (!typed.trim()) { toast("외운 말씀을 먼저 입력해 주세요"); return }
      const g = grade(v.text, typed);
      state.result = { ...g, vid: v.id };
      renderPractice();
      $("answer").value = typed;
      await guarded(store.addAttempt({ verseId: v.id, ref: v.ref, errors: g.errors, total: g.total, passed: g.errors === 0, at: Date.now() }));
    };
    $("btn-hint").onclick = () => { const val = $("answer").value; state.hint = !state.hint; state.show = false; renderPractice(); $("answer").value = val };
    $("btn-show").onclick = () => { const val = $("answer").value; state.show = !state.show; renderPractice(); $("answer").value = val };
    $("btn-grade").addEventListener("click", () => { state.show = false }, { capture: true });
    $("opt-punct").onchange = e => { const val = $("answer").value; state.ignorePunct = e.target.checked; ls.set("ignorePunct", state.ignorePunct); state.result = null; renderPractice(); $("answer").value = val };
    if (!v.builtin) $("btn-edit").onclick = () => openForm(v);
    if (!v.builtin) $("btn-del").onclick = async () => {
      if (pDel !== v.id) { pDel = v.id; renderPractice(); return }
      pDel = null;
      await guarded(store.deleteVerse(v.id), "구절을 삭제했어요");
      state.selected = null; state.result = null; render();
    };
    const retry = $("btn-retry"); if (retry) retry.onclick = () => { state.result = null; renderPractice(); $("answer").value = ""; $("answer").focus() };
  }

  function renderLog() {
    const v = state.verses.find(x => x.id === state.selected);
    const rows = state.attempts.filter(a => !v || a.verseId === v.id).sort((a, b) => b.at - a.at).slice(0, 30);
    $("log-clear").hidden = !v || !rows.length;
    $("log-clear").textContent = clearArmed ? "정말 모두 지울까요? 한 번 더" : "기록 모두 지우기";
    $("log-title").textContent = v ? `내 암송 기록 · ${v.ref}` : "내 암송 기록";
    $("log").innerHTML = rows.length ? rows.map(a => `<li>
      <span class="n">정확도 ${a.total ? Math.max(0, Math.round((1 - a.errors / a.total) * 100)) : 0}%</span>
      <span class="e"><span class="chip ${a.errors === 0 ? "ok" : a.errors <= 3 ? "near" : "new"}">${a.errors === 0 ? "다 맞음" : a.errors + "자 틀림"}</span></span>
      <span class="d">${fmtDate(a.at)}</span>
      <button class="ghost danger" data-del="${esc(a.id)}" style="font-size:12px;padding:2px 6px">${logDel === a.id ? "지울까요?" : "삭제"}</button></li>`).join("")
      : `<li style="display:block;color:var(--muted)">아직 기록이 없어요. 채점하면 여기에 남고, 나만 볼 수 있어요.</li>`;
  }

  /* ---------- verse form ---------- */
  let delArmed = false;
  function openForm(v) {
    state.editing = v ? v.id : "new"; delArmed = false;
    $("f-ref").value = v ? v.ref : ""; $("f-text").value = v ? v.text : "";
    $("f-del").hidden = !v; $("f-del").textContent = "삭제";
    $("f-save").textContent = v ? "수정 저장" : "저장";
    $("verse-form").hidden = false; $("verse-empty").hidden = true;
    $("verse-form").scrollIntoView({ behavior: "smooth", block: "start" });
    $("f-ref").focus({ preventScroll: true });
  }
  function closeForm() { state.editing = null; $("verse-form").hidden = true; render() }
  $("btn-new").onclick = () => openForm(null);
  $("btn-new2").onclick = () => openForm(null);
  $("f-cancel").onclick = closeForm;
  $("verse-form").addEventListener("submit", async e => {
    e.preventDefault();
    const ref = $("f-ref").value.trim(), text = $("f-text").value.trim().replace(/\s+/g, " ");
    if (!ref || !text) return;
    if (state.editing === "new") {
      const id = await guarded(store.addVerse({ ref, text }), "구절을 추가했어요");
      if (id) { state.selected = id; ls.set("sel", id); state.result = null }
    } else await guarded(store.updateVerse(state.editing, { ref, text }), "구절을 수정했어요");
    closeForm();
  });
  $("f-del").onclick = async () => {
    if (!delArmed) { delArmed = true; $("f-del").textContent = "정말 삭제할까요? 한 번 더 누르세요"; return }
    const id = state.editing; await guarded(store.deleteVerse(id), "구절을 삭제했어요");
    if (state.selected === id) state.selected = null;
    closeForm();
  };
  $("btn-sample").onclick = async () => {
    $("btn-sample").disabled = true;
    for (const s of SAMPLES) await guarded(store.addVerse(s));
    toast("예시 구절을 넣었어요 (개역한글)");
  };
  $("log").addEventListener("click", async e => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    const aid = b.dataset.del;
    if (logDel !== aid) { logDel = aid; clearArmed = false; renderLog(); return }
    logDel = null;
    await guarded(store.deleteAttempt(aid), "기록을 지웠어요");
    render();
  });
  $("log-clear").addEventListener("click", async () => {
    if (!clearArmed) { clearArmed = true; logDel = null; renderLog(); return }
    clearArmed = false;
    const vid = state.selected;
    if (vid) await guarded(store.deleteAttempts(vid), "이 구절의 기록을 모두 지웠어요");
    render();
  });
  $("verse-list").addEventListener("click", e => {
    logDel = null; clearArmed = false;
    const b = e.target.closest(".item"); if (!b) return;
    state.selected = b.dataset.id; ls.set("sel", state.selected); state.result = null; state.hint = false; state.show = false; pDel = null;
    $("practice").dataset.vid = ""; render();
    if (window.innerWidth <= 760) $("practice").scrollIntoView({ behavior: "smooth", block: "start" });
  });


  render();
  useLocal();
})();
</script>

</body>
</html>
